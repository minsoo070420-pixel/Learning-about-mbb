<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Question — Case Interview Practice</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="questions-page">
    <div class="questions-header">
      <div>
        <p class="debrief-kicker">{{ difficulty_label }}</p>
        <h1>Choose a question</h1>
      </div>
      <div>
        <a href="{{ url_for('levels') }}" class="change-level-link">Change level</a>
        <a href="{{ url_for('progress') }}" class="change-level-link">My Progress</a>
      </div>
    </div>

    <form action="{{ url_for('new_case') }}" method="post" class="surprise-me-form">
      <button type="submit" class="surprise-me-btn">Surprise me — pick a random one</button>
    </form>

    {% for category, cases in cases_by_category.items() %}
      <details class="question-category">
        <summary>
          <span class="category-badge">{{ category }}</span>
          <span class="question-count">{{ cases|length }} question{{ 's' if cases|length != 1 else '' }}</span>
        </summary>
        <div class="question-list">
          {% for case in cases %}
            <form action="{{ url_for('select_case') }}" method="post">
              <input type="hidden" name="case_id" value="{{ case.id }}">
              <button type="submit" class="question-item">{{ case.title }}</button>
            </form>
          {% endfor %}
        </div>
      </details>
    {% endfor %}
  </div>
</body>
</html>
